---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Install dependencies
    cmds:
      - task: mise
      - task: lefthook

  mise:
    desc: Install workstation dependencies
    cmds:
      - mise trust -q -a
      - mise install -q
    preconditions:
      - sh: command -v mise
        msg: "Mise is not installed. Install it first (for example: brew install mise), then rerun task init."

  lefthook:
    desc: Install Lefthook
    cmds:
      - mise exec -- lefthook install
    preconditions:
      - mise exec -- lefthook version
      - test -f lefthook.yaml
